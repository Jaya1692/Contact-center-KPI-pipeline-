# Databricks Asset Bundle: one job that runs Bronze -> Silver -> Gold daily.
# Not deployed in this repository. Check the current bundle schema and cluster settings in the Databricks docs.
bundle:
  name: contact-center-kpi-pipeline

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:
    kpi_pipeline_daily:
      name: kpi-pipeline-daily
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Chicago"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
          job_cluster_key: main
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
          job_cluster_key: main
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
          job_cluster_key: main
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
      email_notifications:
        on_failure: ["data-team@example.com"]
